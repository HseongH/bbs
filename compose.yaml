services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bbs
      POSTGRES_USER: bbs
      POSTGRES_PASSWORD: bbs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbs -d bbs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        mkdir -p /opt/keycloak/data/import &&
        sed "s|__BBS_HOST__|${BBS_HOST:-localhost}|g"
        /opt/keycloak/data/import-template/bbs-realm.json
        > /opt/keycloak/data/import/bbs-realm.json &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://${BBS_HOST:-localhost}:8081
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import-template:ro
    ports:
      - "8081:8080"
