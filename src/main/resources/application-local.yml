spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: bbs-app
            client-secret: bbs-app-secret
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://${BBS_HOST:localhost}:8081/realms/bbs
            user-name-attribute: preferred_username
