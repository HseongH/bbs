name: backend

on:
  push:
    branches: [main]
    paths-ignore: ["frontend/**"]
  pull_request:
    paths-ignore: ["frontend/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # 포맷, Checkstyle, Error Prone·NullAway 컴파일, ArchUnit을 포함한 전체 테스트, 커버리지 기준
      - run: ./gradlew check

      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: reports
          path: build/reports/
          retention-days: 7
