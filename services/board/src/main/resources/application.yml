spring:
  application:
    name: bbs
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  docker:
    compose:
      # 서비스 디렉터리 기준 경로. Gradle bootRun과 IDE의 기본 작업 디렉터리가 모두 서비스 디렉터리다.
      file: ../../deploy/compose.yaml
      lifecycle-management: start_only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
server:
  shutdown: graceful

bbs:
  internal-token:
    # 내부 토큰을 검증할 auth의 공개키. board가 연결하는 인증 관련 주소는 이것뿐이다 (ADR-0016).
    jwk-set-uri: http://localhost:8082/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    correlation: "[${spring.application.name},%X{traceId:-},%X{spanId:-}] "
