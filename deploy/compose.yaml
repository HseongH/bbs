services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bbs
      POSTGRES_USER: bbs
      POSTGRES_PASSWORD: bbs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bbs -d bbs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis 프로토콜과 호환되는 BSD 라이선스 포크. 스프링 부트는 이미지 이름으로 Valkey를 알아보지 못하므로
  # 레이블로 Redis 연결임을 알려 준다.
  valkey:
    image: valkey/valkey:9-alpine
    labels:
      org.springframework.boot.service-connection: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        mkdir -p /opt/keycloak/data/import &&
        sed "s|__BBS_HOST__|${BBS_HOST:-localhost}|g"
        /opt/keycloak/data/import-template/bbs-realm.json
        > /opt/keycloak/data/import/bbs-realm.json &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://${BBS_HOST:-localhost}:8081
    volumes:
      - ./keycloak:/opt/keycloak/data/import-template:ro
    ports:
      - "8081:8080"
