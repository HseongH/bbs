# 진입점의 라우팅 규칙 (ADR-0016, PRJ-SDS §7.2).
# 경로 체계 개편(/{audience}/{module}/api/**)과 그 밖의 헤더 정리는 다음 단계에서 다룬다.
http:
  routers:
    # 로그인과 로그아웃은 auth가 직접 처리한다.
    auth:
      entryPoints: [web]
      rule: "PathPrefix(`/oauth2`) || PathPrefix(`/login`) || Path(`/logout`)"
      service: auth

    # API는 auth의 판정을 받은 뒤 board로 보낸다.
    api:
      entryPoints: [web]
      rule: "PathPrefix(`/api`)"
      middlewares: [strip-authorization, forward-auth]
      service: board

    # 나머지는 화면이다. 액추에이터와 공개키 경로도 여기로 가므로 브라우저 쪽으로 열리지 않는다.
    web:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      priority: 1
      service: web

  middlewares:
    # 브라우저가 보낸 Authorization을 지운다. 지우지 않으면 auth가 토큰을 붙이지 않는 비로그인 공개 요청에서
    # 브라우저의 헤더가 그대로 board에 닿는다 (COM-NFR-007).
    strip-authorization:
      headers:
        customRequestHeaders:
          Authorization: ""

    forward-auth:
      forwardAuth:
        address: "http://host.docker.internal:8082/forward-auth"
        # auth가 붙인 내부 토큰만 board에 넘긴다.
        authResponseHeaders: [Authorization]
        # ForwardAuth는 기본적으로 auth의 Set-Cookie를 버린다. 화면이 쓸 CSRF 쿠키는 명시해서 전달한다.
        addAuthCookiesToResponse: [XSRF-TOKEN]

  services:
    auth:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8082"
    board:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"
    web:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
